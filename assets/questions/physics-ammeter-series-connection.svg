<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" role="img" aria-label="電流計を回路に直列に接続した図">
  <rect x="1" y="1" width="298" height="188" fill="#ffffff" stroke="none" />

  <!-- 回路の輪(電流計の部分で分断) -->
  <path d="M 40 30 H 260 V 62" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" />
  <path d="M 260 98 V 130 H 40 V 30" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" />

  <!-- 電池記号 -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round">
    <line x1="20" y1="65" x2="20" y2="95" />
    <line x1="30" y1="72" x2="30" y2="88" />
  </g>
  <line x1="40" y1="80" x2="8" y2="80" stroke="#334155" stroke-width="4" stroke-linecap="round" />

  <!-- 豆電球 -->
  <circle cx="150" cy="30" r="16" fill="#ffffff" stroke="#334155" stroke-width="4" />
  <line x1="139" y1="19" x2="161" y2="41" stroke="#334155" stroke-width="3" />
  <line x1="161" y1="19" x2="139" y2="41" stroke="#334155" stroke-width="3" />

  <!-- 電流計(回路の道すじに直列に組み込まれている) -->
  <circle cx="260" cy="80" r="18" fill="#fff7ed" stroke="#b45309" stroke-width="4" />
  <text x="260" y="86" font-size="16" fill="#b45309" text-anchor="middle" font-weight="bold">A</text>

  <text x="150" y="165" font-size="14" fill="#334155" text-anchor="middle">電流計を回路の道すじに直列に組み込んでいる</text>
</svg>
