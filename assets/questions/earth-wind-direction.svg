<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-label="北東の方角から中心に向かって風がふいているようすを表す方位図">
  <rect x="1" y="1" width="258" height="258" fill="#ffffff" stroke="none" />

  <circle cx="130" cy="130" r="95" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <text x="130" y="22" font-size="16" fill="#334155" text-anchor="middle" font-weight="bold">北</text>
  <text x="130" y="248" font-size="16" fill="#334155" text-anchor="middle" font-weight="bold">南</text>
  <text x="238" y="136" font-size="16" fill="#334155" text-anchor="middle" font-weight="bold">東</text>
  <text x="22" y="136" font-size="16" fill="#334155" text-anchor="middle" font-weight="bold">西</text>

  <line x1="130" y1="35" x2="130" y2="225" stroke="#cbd5e1" stroke-width="1" />
  <line x1="35" y1="130" x2="225" y2="130" stroke="#cbd5e1" stroke-width="1" />

  <!-- 北東から中心へ向かう風の矢印 -->
  <line x1="195" y1="65" x2="140" y2="120" stroke="#1d4ed8" stroke-width="5" marker-end="url(#windArrow)" />

  <circle cx="130" cy="130" r="5" fill="#334155" />

  <defs>
    <marker id="windArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8" />
    </marker>
  </defs>
</svg>
