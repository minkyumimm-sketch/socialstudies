<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" role="img" aria-label="電圧計を豆電球に並列に接続した図">
  <rect x="1" y="1" width="298" height="188" fill="#ffffff" stroke="none" />

  <!-- 回路の輪(そのままつながっている) -->
  <path d="M 40 30 H 260 V 130 H 40 Z" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" />

  <!-- 電池記号 -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round">
    <line x1="20" y1="65" x2="20" y2="95" />
    <line x1="30" y1="72" x2="30" y2="88" />
  </g>
  <line x1="40" y1="80" x2="8" y2="80" stroke="#334155" stroke-width="4" stroke-linecap="round" />

  <!-- 豆電球 -->
  <circle cx="150" cy="30" r="16" fill="#ffffff" stroke="#334155" stroke-width="4" />
  <line x1="139" y1="19" x2="161" y2="41" stroke="#334155" stroke-width="3" />
  <line x1="161" y1="19" x2="139" y2="41" stroke="#334155" stroke-width="3" />

  <!-- 電圧計への分岐(豆電球に対して並列) -->
  <path d="M 130 30 V 85 H 132" fill="none" stroke="#334155" stroke-width="3" />
  <path d="M 170 30 V 85 H 168" fill="none" stroke="#334155" stroke-width="3" />
  <circle cx="150" cy="85" r="18" fill="#eef2ff" stroke="#4338ca" stroke-width="4" />
  <text x="150" y="91" font-size="16" fill="#4338ca" text-anchor="middle" font-weight="bold">V</text>

  <text x="150" y="165" font-size="14" fill="#334155" text-anchor="middle">電圧計が豆電球に対して枝分かれ(並列)につながっている</text>
</svg>
