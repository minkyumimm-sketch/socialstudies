<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="抵抗R1とR2が並列につながれ、分岐前後に点P・Q・Sがある回路図">
  <rect x="1" y="1" width="298" height="198" fill="#ffffff" stroke="none" />

  <!-- 電池記号(左のバス間) -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round">
    <line x1="20" y1="80" x2="20" y2="110" />
    <line x1="30" y1="88" x2="30" y2="102" />
  </g>
  <line x1="30" y1="40" x2="30" y2="88" stroke="#334155" stroke-width="4" />
  <line x1="20" y1="102" x2="20" y2="160" stroke="#334155" stroke-width="4" />

  <!-- 上下のバス(共通線) -->
  <line x1="30" y1="40" x2="260" y2="40" stroke="#334155" stroke-width="4" />
  <line x1="20" y1="160" x2="260" y2="160" stroke="#334155" stroke-width="4" />

  <!-- 枝1: R1 -->
  <line x1="130" y1="40" x2="130" y2="80" stroke="#334155" stroke-width="4" />
  <rect x="112" y="80" width="36" height="40" fill="#fff7ed" stroke="#b45309" stroke-width="3" />
  <text x="130" y="104" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">R1</text>
  <line x1="130" y1="120" x2="130" y2="160" stroke="#334155" stroke-width="4" />

  <!-- 枝2: R2 -->
  <line x1="200" y1="40" x2="200" y2="80" stroke="#334155" stroke-width="4" />
  <rect x="182" y="80" width="36" height="40" fill="#fff7ed" stroke="#b45309" stroke-width="3" />
  <text x="200" y="104" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">R2</text>
  <line x1="200" y1="120" x2="200" y2="160" stroke="#334155" stroke-width="4" />

  <!-- 右端閉じ -->
  <line x1="260" y1="40" x2="260" y2="160" stroke="#334155" stroke-width="4" />

  <!-- 点P(分岐前) -->
  <circle cx="80" cy="40" r="4" fill="#1d4ed8" />
  <text x="80" y="28" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold">P</text>

  <!-- 点Q(R1の枝) -->
  <circle cx="130" cy="60" r="4" fill="#0f766e" />
  <text x="105" y="63" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">Q</text>

  <!-- 点S(R2の枝) -->
  <circle cx="200" cy="60" r="4" fill="#0f766e" />
  <text x="225" y="63" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">S</text>
</svg>
