<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="地下の地点アと、その真上の地表の地点イを示す断面図">
  <rect x="1" y="1" width="298" height="198" fill="#ffffff" stroke="none" />

  <!-- 地下の領域 -->
  <rect x="20" y="60" width="260" height="120" fill="#f3ead6" stroke="none" />
  <text x="260" y="30" font-size="14" fill="#334155" text-anchor="middle">地表側</text>
  <text x="260" y="175" font-size="14" fill="#334155" text-anchor="middle">地下</text>

  <!-- 地表面 -->
  <line x1="20" y1="60" x2="280" y2="60" stroke="#334155" stroke-width="4" />

  <!-- 点イ(地表) -->
  <circle cx="150" cy="60" r="6" fill="#1d4ed8" />
  <text x="150" y="40" font-size="16" fill="#1d4ed8" text-anchor="middle" font-weight="bold">イ</text>

  <!-- 点ア(地下) -->
  <circle cx="150" cy="140" r="6" fill="#b91c1c" />
  <text x="150" y="165" font-size="16" fill="#b91c1c" text-anchor="middle" font-weight="bold">ア</text>

  <!-- 結ぶ点線 -->
  <line x1="150" y1="66" x2="150" y2="134" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" />
</svg>
