<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="机の上で静止している物体にはたらく重力と垂直抗力の図">
  <rect x="1" y="1" width="298" height="198" fill="#ffffff" stroke="none" />

  <!-- 机(床)の面 -->
  <line x1="40" y1="140" x2="260" y2="140" stroke="#334155" stroke-width="4" />
  <text x="230" y="158" font-size="14" fill="#334155" text-anchor="middle">机の面</text>

  <!-- 物体 -->
  <rect x="120" y="80" width="60" height="60" fill="#f3f6fc" stroke="#334155" stroke-width="4" />
  <text x="150" y="115" font-size="14" fill="#334155" text-anchor="middle">物体</text>

  <!-- 垂直抗力(上向き、机の面から) -->
  <line x1="150" y1="140" x2="150" y2="78" stroke="#1d4ed8" stroke-width="5" marker-end="url(#arrowN)" />
  <text x="115" y="60" font-size="14" fill="#1d4ed8" text-anchor="middle">垂直抗力</text>

  <!-- 重力(下向き、物体の中心から) -->
  <line x1="150" y1="110" x2="150" y2="172" stroke="#b91c1c" stroke-width="5" marker-end="url(#arrowG)" />
  <text x="185" y="185" font-size="14" fill="#b91c1c" text-anchor="middle">重力</text>

  <text x="150" y="18" font-size="13" fill="#334155" text-anchor="middle">物体は静止している</text>

  <defs>
    <marker id="arrowN" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8" />
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b91c1c" />
    </marker>
  </defs>
</svg>
