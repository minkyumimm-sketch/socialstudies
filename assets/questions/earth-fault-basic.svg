<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img" aria-label="地層が力を受けて切れ、左右でずれている断層の図">
  <rect x="1" y="1" width="298" height="218" fill="#ffffff" stroke="none" />

  <rect x="40" y="30" width="220" height="160" fill="none" stroke="#334155" stroke-width="3" />

  <clipPath id="faultLeft">
    <polygon points="40,30 166.7,30 113.3,190 40,190" />
  </clipPath>
  <clipPath id="faultRight">
    <polygon points="166.7,30 260,30 260,190 113.3,190" />
  </clipPath>

  <g clip-path="url(#faultLeft)">
    <rect x="40" y="30" width="220" height="50" fill="#fef3c7" />
    <rect x="40" y="80" width="220" height="50" fill="#dbeafe" />
    <rect x="40" y="130" width="220" height="60" fill="#fde2e2" />
  </g>

  <g clip-path="url(#faultRight)">
    <rect x="40" y="70" width="220" height="50" fill="#fef3c7" />
    <rect x="40" y="120" width="220" height="50" fill="#dbeafe" />
    <rect x="40" y="170" width="220" height="60" fill="#fde2e2" />
  </g>

  <line x1="166.7" y1="30" x2="113.3" y2="190" stroke="#b91c1c" stroke-width="4" />
  <text x="180" y="45" font-size="13" fill="#b91c1c" text-anchor="start">ずれの面</text>

  <rect x="40" y="30" width="220" height="160" fill="none" stroke="#334155" stroke-width="3" />

  <text x="150" y="210" font-size="13" fill="#334155" text-anchor="middle">同じ層が赤い面をはさんで上下にずれている</text>
</svg>
